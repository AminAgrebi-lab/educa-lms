[uwsgi]
# 🚨 ADAPTED: in THIS repo the project root mounts at /code (not /code/educa)
socket=/code/uwsgi_app.sock
chdir=/code/
# The WSGI callable defined in educa/wsgi.py
module=educa.wsgi:application
# Enable the uWSGI master process that manages the workers
master=true
# Permissions so NGINX can read/write the socket file
chmod-socket=666
# Run worker processes as the www-data user/group
uid=www-data
gid=www-data
# Delete the socket file when uWSGI stops (no stale sockets)
vacuum=true